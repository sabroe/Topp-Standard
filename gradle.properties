org.gradle.console=colored
org.gradle.warning.mode=all
org.gradle.configuration-cache=true
#Note: 'warn' prints a banner on every build. To look for problems once: -Dorg.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.problems=fail
org.gradle.configuration-cache.max-problems=5
org.gradle.configuration-cache.parallel=false
#org.gradle.jvmargs=-Xmx512m "-XX:MaxMetaspaceSize=384m"
org.gradle.jvmargs=-Xmx1024m "-XX:MaxMetaspaceSize=768m"

org.gradle.priority=low
org.gradle.workers.max=4
org.gradle.parallel=false

# Javadoc: all doclint checks except 'missing', so missing comments, @param and @return don't give warnings.
javadoc.x.doc-lint.all = false
javadoc.x.doc-lint.accessibility = true
javadoc.x.doc-lint.html = true
javadoc.x.doc-lint.missing = false
javadoc.x.doc-lint.reference = true
javadoc.x.doc-lint.syntax = true

# Checkstyle: switched off. To run it once: -Pconvention.checkstyle.enable=true
convention.checkstyle.enable = false

# SpotBugs: switched off. To run it once: -Pconvention.spotbugs.enable=true
convention.spotbugs.enable = false

# Tests: limits for the test JVMs, so a test run doesn't freeze the machine. Unset = Gradle's defaults (1 fork, 512m heap).
convention.junit.test.max-parallel-forks = 2
convention.junit.test.max-heap-size = 512m
